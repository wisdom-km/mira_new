# Deploy the zoomable architecture viewer to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/architecture.html"
      - "docs/index.html"
      - "docs/.nojekyll"
      - "docs/dev-map/architecture.mmd"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site/dev-map
          cp docs/architecture.html docs/index.html docs/.nojekyll site/
          cp docs/dev-map/architecture.mmd site/dev-map/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
