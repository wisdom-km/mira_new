<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DirectorDesk 架构</title>
  <meta name="description" content="DirectorDesk 运行时架构：滚轮缩放、拖拽平移、点击节点打开源码。" />
  <style>
    :root {
      --bg: #f4f6f8;
      --ink: #0f172a;
      --muted: #64748b;
      --line: #e2e8f0;
      --panel: rgba(255, 255, 255, 0.86);
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 ui-sans-serif, "Segoe UI", system-ui, sans-serif;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .top, .bottom {
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 18px;
      background: var(--panel);
      border-color: var(--line);
      backdrop-filter: blur(16px);
    }

    .top {
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .bottom {
      justify-content: space-between;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .brand strong {
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .brand span { color: var(--muted); font-size: 12px; }

    .tools, .legend {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    button, .link {
      appearance: none;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 140ms var(--ease-out), background 140ms ease, border-color 140ms ease;
    }

    button:hover, .link:hover { background: #f8fafc; }
    button:active, .link:active { transform: scale(0.97); }

    .zoom {
      min-width: 4.5rem;
      text-align: center;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    #stage {
      position: relative;
      overflow: hidden;
      cursor: grab;
      background:
        radial-gradient(circle at top, rgba(219, 234, 254, 0.7), transparent 28%),
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: auto, 28px 28px, 28px 28px;
      background-position: center, 0 0, 0 0;
    }

    #stage.is-dragging { cursor: grabbing; }

    #world {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      will-change: transform;
    }

    #world svg {
      display: block;
      overflow: visible;
      max-width: none;
      max-height: none;
    }

    #world a { cursor: pointer; }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip i {
      width: 10px;
      height: 10px;
      border-radius: 999px;
      display: inline-block;
    }

    .status { color: #b45309; }

    @media (max-width: 720px) {
      .top, .bottom { padding: 10px 12px; }
      .brand span, .hint { display: none; }
    }
  </style>
</head>

</script>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

    const stage = document.getElementById("stage");
    const zoomLabel = document.getElementById("zoom-label");
    const embedded = document.getElementById("architecture-source").textContent.trim();

    const state = { scale: 1, x: 0, y: 0 };
    let world = null;
    let dragging = false;
    let moved = false;
    let lastX = 0;
    let lastY = 0;
    let fitScale = 1;

    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    async function loadSource() {
      try {
        const response = await fetch("./dev-map/architecture.mmd", { cache: "no-cache" });
        if (response.ok) {
          const text = (await response.text()).trim();
          if (text) return text;
        }
      } catch (_) {
        /* file:// or offline: use the embedded copy */
      }
      return embedded;
    }

    function applyTransform() {
      world.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
      zoomLabel.textContent = `${Math.round(state.scale * 100)}%`;
    }

    function zoomAt(clientX, clientY, nextScale) {
      const rect = stage.getBoundingClientRect();
      const mx = clientX - rect.left;
      const my = clientY - rect.top;
      const scale = clamp(nextScale, 0.2, 8);
      const ratio = scale / state.scale;
      state.x = mx - (mx - state.x) * ratio;
      state.y = my - (my - state.y) * ratio;
      state.scale = scale;
      applyTransform();
    }

    function fit() {
      if (!world) return;
      const svg = world.querySelector("svg");
      if (!svg) return;
      const { width, height } = diagramSize(svg);
      const pad = 40;
      const sx = (stage.clientWidth - pad * 2) / width;
      const sy = (stage.clientHeight - pad * 2) / height;
      state.scale = clamp(Math.min(sx, sy), 0.05, 8);
      fitScale = state.scale;
      state.x = (stage.clientWidth - width * state.scale) / 2;
      state.y = (stage.clientHeight - height * state.scale) / 2;
      applyTransform();
    }

    function reset() {
      if (!world) return;
      const svg = world.querySelector("svg");
      if (!svg) return;
      const { width, height } = diagramSize(svg);
      state.scale = 1;
      state.x = (stage.clientWidth - width) / 2;
      state.y = (stage.clientHeight - height) / 2;
      applyTransform();
    }

    function pixelAttr(value) {
      if (!value || String(value).includes("%")) return 0;
      const parsed = parseFloat(value);
      return Number.isFinite(parsed) && parsed > 1 ? parsed : 0;
    }

    function sizeSvg(svg) {
      const viewBox = svg.viewBox && svg.viewBox.baseVal;
      const width = (viewBox && viewBox.width)
        || pixelAttr(svg.getAttribute("width"))
        || svg.getBBox().width
        || 1;
      const height = (viewBox && viewBox.height)
        || pixelAttr(svg.getAttribute("height"))
        || svg.getBBox().height
        || 1;
      svg.setAttribute("width", String(width));
      svg.setAttribute("height", String(height));
      svg.style.width = `${width}px`;
      svg.style.height = `${height}px`;
      svg.style.maxWidth = "none";
      svg.style.maxHeight = "none";
      return { width, height };
    }

    function diagramSize(svg) {
      return {
        width: parseFloat(svg.style.width) || svg.getBBox().width || 1,
        height: parseFloat(svg.style.height) || svg.getBBox().height || 1,
      };
    }

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: "loose",
      theme: "base",
      flowchart: { htmlLabels: true, curve: "basis", padding: 16 },
    });

    try {
      const source = await loadSource();
      const { svg } = await mermaid.render("architecture-graph", source);

      world = document.createElement("div");
      world.id = "world";
      world.innerHTML = svg;
      stage.appendChild(world);

      const rendered = world.querySelector("svg");
      if (!rendered) throw new Error("Mermaid 没有生成 SVG");
      sizeSvg(rendered);
      world.querySelectorAll("a").forEach((anchor) => {
        anchor.setAttribute("target", "_blank");
        anchor.setAttribute("rel", "noopener noreferrer");
      });

      await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      fit();
    } catch (error) {
      const note = document.createElement("div");
      note.className = "status";
      note.style.padding = "24px";
      note.textContent = `架构图渲染失败：${error instanceof Error ? error.message : String(error)}`;
      stage.appendChild(note);
      throw error;
    }

    stage.addEventListener("wheel", (event) => {
      event.preventDefault();
      const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
      zoomAt(event.clientX, event.clientY, state.scale * factor);
    }, { passive: false });

    stage.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      if (event.target.closest("a")) return;
      dragging = true;
      moved = false;
      lastX = event.clientX;
      lastY = event.clientY;
      stage.classList.add("is-dragging");
      stage.setPointerCapture(event.pointerId);
    });

    stage.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      const dx = event.clientX - lastX;
      const dy = event.clientY - lastY;
      if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
      state.x += dx;
      state.y += dy;
      lastX = event.clientX;
      lastY = event.clientY;
      applyTransform();
    });

    const endDrag = (event) => {
      if (!dragging) return;
      dragging = false;
      stage.classList.remove("is-dragging");
      if (stage.hasPointerCapture(event.pointerId)) {
        stage.releasePointerCapture(event.pointerId);
      }
    };

    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);

    stage.addEventListener("click", (event) => {
      if (moved) event.preventDefault();
    }, true);

    stage.addEventListener("dblclick", (event) => {
      if (event.target.closest("a")) return;
      zoomAt(event.clientX, event.clientY, state.scale * 1.45);
    });

    document.getElementById("zoom-in").addEventListener("click", () => {
      zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, state.scale * 1.2);
    });
    document.getElementById("zoom-out").addEventListener("click", () => {
      zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, state.scale / 1.2);
    });
    document.getElementById("fit").addEventListener("click", fit);
    document.getElementById("reset").addEventListener("click", reset);

    window.addEventListener("resize", fit);

    window.addEventListener("keydown", (event) => {
      if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement) return;
      const step = 48;
      if (event.key === "+" || event.key === "=") zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, state.scale * 1.2);
      if (event.key === "-" || event.key === "_") zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, state.scale / 1.2);
      if (event.key === "0") fit();
      if (event.key === "1") reset();
      if (event.key === "ArrowLeft") state.x += step;
      if (event.key === "ArrowRight") state.x -= step;
      if (event.key === "ArrowUp") state.y += step;
      if (event.key === "ArrowDown") state.y -= step;
      if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) {
        event.preventDefault();
        applyTransform();
      }
    });

    fitScale = state.scale;
  </script>
</body>
